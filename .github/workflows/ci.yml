name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: apps/commerce-api

env:
  DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/commerce_db_test
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: ci-test-secret-key-minimum-32-chars-long
  JWT_SECRET_KEY: ci-test-jwt-secret-key-minimum-32-chars
  ENVIRONMENT: test

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff black mypy
      - run: ruff check app/
      - run: black --check app/
      - run: mypy app/ --ignore-missing-imports

  architecture-gates:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio import-linter
      - name: Frozen identifier ban
        run: python scripts/check_frozen_identifiers.py
      - name: Import boundary check
        run: lint-imports
      - name: Architecture tests
        run: pytest tests/architecture/ -v

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: commerce_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd redis-cli ping
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio pytest-cov httpx
      - name: Run database migrations
        run: alembic upgrade head
      - name: Run unit tests
        run: pytest tests/unit/ tests/merchant/ tests/concurrency/ tests/security/ -v --cov=app --cov-report=xml
      - uses: codecov/codecov-action@v3
        with:
          file: apps/commerce-api/coverage.xml

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: commerce_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd redis-cli ping
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio httpx
      - name: Migration smoke test
        run: pytest tests/integration/test_migration_smoke.py -v
      - name: Run integration tests
        run: pytest tests/integration/ -v --ignore=tests/integration/test_migration_smoke.py

  rls-policy-check:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: commerce_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run database migrations
        run: alembic upgrade head
      - name: Check RLS coverage
        run: python scripts/check_rls_coverage.py
      - name: Check tenant-first indexes
        run: python scripts/check_tenant_indexes.py

  openapi-contract:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/architecture/test_openapi_contract.py -v

  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit
      - run: pip-audit -r requirements.txt
      - run: bandit -r app/ -f json -o bandit-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: apps/commerce-api/bandit-report.json

  build:
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - rls-policy-check
      - architecture-gates
      - openapi-contract
      - security-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -f Dockerfile -t cruxnexus-commerce-api:${{ github.sha }} .
        working-directory: apps/commerce-api
      - name: Validate Docker image import
        run: docker run --rm cruxnexus-commerce-api:${{ github.sha }} python -c "import app.main; print('Import successful')"
