name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff black mypy
      - run: ruff check app/
      - run: black --check app/
      - run: mypy app/

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: commerce_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd redis-cli ping
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio pytest-cov httpx
      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          REDIS_URL: ${{ secrets.CI_REDIS_URL }}
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
          ENVIRONMENT: test
        run: pytest tests/ -v --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: commerce_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd redis-cli ping
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio pytest-cov httpx
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          REDIS_URL: ${{ secrets.CI_REDIS_URL }}
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
          ENVIRONMENT: test
        run: alembic upgrade head
      - name: Run tenant isolation tests
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          REDIS_URL: ${{ secrets.CI_REDIS_URL }}
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
          ENVIRONMENT: test
        run: pytest tests/integration/test_tenant_isolation.py -v

  rls-policy-check:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: commerce_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd redis-cli ping
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          REDIS_URL: ${{ secrets.CI_REDIS_URL }}
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
          ENVIRONMENT: test
        run: alembic upgrade head
      - name: Check RLS coverage
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          REDIS_URL: ${{ secrets.CI_REDIS_URL }}
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
          ENVIRONMENT: test
        run: python scripts/check_rls_coverage.py

  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit
      - name: Run pip-audit
        run: pip-audit
      - name: Run bandit security scan
        run: bandit -r app/ -f json -o bandit-report.json
      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: bandit-report.json

  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, rls-policy-check, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image for validation
        run: docker build -f apps/commerce-api/Dockerfile -t cruxnexus-commerce-api:${{ github.sha }} apps/commerce-api
      - name: Validate Docker image
        run: docker run --rm cruxnexus-commerce-api:${{ github.sha }} python -c "import app.main; print('Import successful')"